# Paths are on the same FAT EFI volume as BootApp.
timeout=5
default=windows

[entry windows]
title=Windows Boot Manager
path=\EFI\Microsoft\Boot\bootmgfw.efi
arch=x64

[entry linux]
title=Linux (EFI loader or unified kernel image)
path=\EFI\Linux\linux.efi
arch=x64

[entry rescue]
title=UEFI Shell / Rescue
path=\EFI\Tools\Shell.efi
# arch may be omitted when this volume is prepared for only one architecture.
